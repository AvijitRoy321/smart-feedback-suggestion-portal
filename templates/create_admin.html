<!DOCTYPE html>
<html>

<head>

    <title>Create Admin</title>

    <link rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='images/favicon.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3 class="text-center">
                        ➕ Create New Administrator
                    </h3>

                </div>

                <div class="card-body">

                    {% if error %}
                    
                    <div class="alert alert-danger">
                        
                        {{ error }}
                    
                    </div>
                    
                    {% endif %}

                    {% if success %}
                    
                    <div class="alert alert-success">
                        
                        {{ success }}
                    
                    </div>
                    
                    {% endif %}

                    <form method="POST">
                        
                        <div class="mb-3">
                            <label class="form-label">
                                
                                Full Name
                            
                            </label>
                            
                            <input
                            type="text"
                            name="name"
                            class="form-control"
                            required>
                        </div>

                        <div class="mb-3">
                            
                            <label class="form-label">
                                
                                Email Address
                            
                            </label>
                            
                            <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>
                        
                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                        </div>

                        <div class="text-center">

                            <button class="btn btn-success">

                                📧 Send OTP

                            </button>
                            
                            <a href="/dashboard_v2" 
                                class="btn btn-secondary">
                                
                                ← Back to Dashboard
                        
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
