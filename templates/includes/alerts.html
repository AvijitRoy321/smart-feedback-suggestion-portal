<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}

<script>

document.addEventListener("DOMContentLoaded", function () {

    {% for category, message in messages %}

    Swal.fire({

        icon:
        "{% if category == 'success' %}success{% elif category == 'danger' %}error{% elif category == 'warning' %}warning{% else %}info{% endif %}",

        title: "{% if category == 'success' %}Success{% elif category == 'danger' %}Error{% elif category == 'warning' %}Warning{% else %}Information{% endif %}",

        text: "{{ message|safe }}",

        timer: 2500,

        timerProgressBar: true,

        showConfirmButton: false

    });

    {% endfor %}

});

</script>

{% endif %}
{% endwith %}
