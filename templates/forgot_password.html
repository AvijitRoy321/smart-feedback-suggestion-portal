<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Smart Feedback & Suggestion Portal</title>

    <link rel="icon"
          type="image/png"
          href="{{ url_for('static', filename='images/favicon.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

{% include "includes/alerts.html" %}

<div class="container mt-5" style="max-width:500px;">

    <div class="text-center mb-4">

        <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="SFSP Logo"
            width="140"
            class="img-fluid">

    </div>

    {% if otp_verified %}
        <h2 class="text-center fw-bold mb-4">
            Reset Password
        </h2>
    {% else %}
        <h2 class="text-center fw-bold mb-4">
            Forgot Password
        </h2>
    {% endif %}

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                required>

        </div>

        {% if otp_verified %}

        <div class="mb-3">

            <label class="form-label">
                New Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                class="form-control"
                required>

        </div>

        {% endif %}

        <button
            type="submit"
            class="btn btn-primary w-100">

            {% if otp_verified %}
                🔒 Update Password
            {% else %}
                📧 Send OTP
            {% endif %}

        </button>

    </form>

</div>

</body>

</html>
