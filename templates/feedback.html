<!DOCTYPE html>

<html>

<head>

<title>Feedback</title>

<link rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/favicon.png') }}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="container mt-5">

{% include "includes/alerts.html" %}

<div class="container mt-3">

</div>

<h2 class="text-center fw-bold text-primary mb-2">
    📝 Smart Feedback & Suggestion Form
</h2>

<p class="text-center text-muted mb-4">
    Please provide your valuable feedback for all categories.
    Your opinion helps us improve the quality of education.
</p>

<form method="POST">

<!-- ===================================== -->
<!-- COURSE FEEDBACK -->
<!-- ===================================== -->

<div class="card shadow-lg mb-4">

    <div class="card-header bg-primary text-white">

        <h4 class="mb-0">
            📚 Course Feedback
        </h4>

    </div>

    <div class="card-body">

        <label class="form-label fw-bold">

            Overall Course Quality

        </label>

        <div class="mt-2">

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="course_rating"
                       value="Excellent Course Content"
                       required>

                <label class="form-check-label">
                    🌟 Excellent Course Content
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="course_rating"
                       value="Good Course Structure">

                <label class="form-check-label">
                    😊 Good Course Structure
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="course_rating"
                       value="Average Course">

                <label class="form-check-label">
                    😐 Average Course
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="course_rating"
                       value="Needs Improvement">

                <label class="form-check-label">
                    😕 Needs Improvement
                </label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input"
                       type="radio"
                       name="course_rating"
                       value="Poor Course Design">

                <label class="form-check-label">
                    😞 Poor Course Design
                </label>
            </div>

        </div>

        <label class="form-label fw-bold">

            Additional Comments (Optional)

        </label>

        <textarea
            class="form-control"
            rows="4"
            maxlength="300"
            name="course_comment"
            placeholder="Write your comments about the course..."></textarea>

    </div>

</div>

<!-- ===================================== -->
<!-- FACULTY FEEDBACK -->
<!-- ===================================== -->

<div class="card shadow-lg mb-4">

    <div class="card-header bg-success text-white">

        <h4 class="mb-0">
            👨‍🏫 Faculty Feedback
        </h4>

    </div>

    <div class="card-body">

        <label class="form-label fw-bold">
            Teaching Performance
        </label>

        <div class="mt-2">

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="faculty_rating"
                       value="Excellent Teaching"
                       required>

                <label class="form-check-label">
                    🌟 Excellent Teaching
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="faculty_rating"
                       value="Good Explanation">

                <label class="form-check-label">
                    😊 Good Explanation
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="faculty_rating"
                       value="Average Teaching">

                <label class="form-check-label">
                    😐 Average Teaching
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="faculty_rating"
                       value="Needs Improvement">

                <label class="form-check-label">
                    😕 Needs Improvement
                </label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input"
                       type="radio"
                       name="faculty_rating"
                       value="Poor Teaching">

                <label class="form-check-label">
                    😞 Poor Teaching
                </label>
            </div>

        </div>

        <label class="form-label fw-bold">
            Additional Comments (Optional)
        </label>

        <textarea
            class="form-control"
            rows="4"
            maxlength="300"
            name="faculty_comment"
            placeholder="Write your comments about the faculty..."></textarea>

    </div>

</div>

<!-- ===================================== -->
<!-- FACILITIES FEEDBACK -->
<!-- ===================================== -->

<div class="card shadow-lg mb-4">

    <div class="card-header bg-warning">

        <h4 class="mb-0">
            🏫 Facilities Feedback
        </h4>

    </div>

    <div class="card-body">

        <label class="form-label fw-bold">
            Campus Facilities
        </label>

        <div class="mt-2">

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="facility_rating"
                       value="Excellent Facilities"
                       required>

                <label class="form-check-label">
                    🌟 Excellent Facilities
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="facility_rating"
                       value="Good Infrastructure">

                <label class="form-check-label">
                    😊 Good Infrastructure
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="facility_rating"
                       value="Average Facilities">

                <label class="form-check-label">
                    😐 Average Facilities
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="facility_rating"
                       value="Needs Improvement">

                <label class="form-check-label">
                    😕 Needs Improvement
                </label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input"
                       type="radio"
                       name="facility_rating"
                       value="Poor Maintenance">

                <label class="form-check-label">
                    😞 Poor Maintenance
                </label>
            </div>

        </div>

        <label class="form-label fw-bold">
            Additional Comments (Optional)
        </label>

        <textarea
            class="form-control"
            rows="4"
            maxlength="300"
            name="facility_comment"
            placeholder="Write your comments about campus facilities..."></textarea>

    </div>

</div>

<!-- ===================================== -->
<!-- OVERALL SUGGESTIONS -->
<!-- ===================================== -->

<div class="card shadow-lg mb-4">

    <div class="card-header bg-dark text-white">

        <h4 class="mb-0">
            💡 Overall Suggestions (Optional)
        </h4>

    </div>

    <div class="card-body">

        <textarea
            class="form-control"
            rows="5"
            maxlength="500"
            name="overall_suggestion"
            placeholder="Share any additional suggestions that can help improve the institution..."></textarea>

    </div>

</div>

<div class="text-center mb-5">

    <button
        class="btn btn-success btn-lg px-5">

        ✅ Submit Complete Feedback

    </button>

</div>

</form>

</body>

</html>
