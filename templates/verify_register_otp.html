<!DOCTYPE html>
<html>

<head>

    <title>Verify Registration OTP</title>

    <link rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='images/favicon.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-primary text-white text-center">

                    <h3>📧 Verify Your Email</h3>

                </div>

                <div class="card-body">

                    {% include "includes/alerts.html" %}

                    <p class="text-center">
                        Enter the 6-digit OTP sent to your email.
                    </p>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                OTP
                            </label>

                            <input
                                type="text"
                                name="otp"
                                maxlength="6"
                                class="form-control"
                                placeholder="Enter OTP"
                                required>

                        </div>

                        <button
                            class="btn btn-success w-100">

                            ✅ Verify OTP

                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <a href="/resend_register_otp"
                           id="resendBtn"
                           class="btn btn-warning {% if remaining>0 %}disabled{% endif %}">

                            🔄 Resend OTP

                        </a>

                        <div
                            id="countdown"
                            class="text-danger fw-bold mt-2">

                            {% if remaining>0 %}

                                Resend OTP in {{ remaining }} seconds

                            {% endif %}

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

let seconds = {{ remaining }};

let btn = document.getElementById("resendBtn");

let countdown = document.getElementById("countdown");

if(seconds > 0){

    let timer = setInterval(function(){

        seconds--;

        countdown.innerHTML =
        "Resend OTP in " + seconds + " seconds";

        if(seconds <= 0){

            clearInterval(timer);

            btn.classList.remove("disabled");

            countdown.innerHTML = "";

        }

    },1000);

}

</script>

</body>

</html>
